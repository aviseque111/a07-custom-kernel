name: Build A07 Kernel

on:
  workflow_dispatch:
    inputs:
      lto:
        description: "LTO mode (stock is full; thin/none use far less RAM)"
        default: "thin"
        type: choice
        options: [thin, none, full]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift \
            /usr/local/share/powershell /usr/local/lib/node_modules /opt/microsoft || true
          sudo apt-get clean
          df -h /

      - name: Add swap (full LTO link needs a lot of memory)
        run: |
          free -h; df -h /mnt
          sudo swapoff -a || true
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: Host packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev cpio \
            python-is-python3 python3 rsync zip unzip xz-utils lz4 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi
          sudo apt-get install -y python2 || true
          sudo apt-get install -y device-tree-compiler kmod lzop zstd bzip2 file

      - name: Fetch AOSP clang r416183b into the path build.sh expects
        run: |
          D="$GITHUB_WORKSPACE/kernel/kernel/prebuilts-master/clang/host/linux-x86/clang-r416183b"
          mkdir -p "$D"
          curl -fL --retry 3 -o clang.tgz \
            "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/e0d2094f1f6cfcbf1d82a8be7fd9c756810e7eb3/clang-r416183b.tar.gz"
          tar -xzf clang.tgz -C "$D"
          rm -f clang.tgz
          "$D/bin/clang" --version

      - name: Populate build-tools path and sysroot (build.sh uses a locked-down PATH)
        run: |
          B="$GITHUB_WORKSPACE/kernel/kernel/build/build-tools/path/linux-x86"
          CB="$GITHUB_WORKSPACE/kernel/kernel/prebuilts-master/clang/host/linux-x86/clang-r416183b/bin"
          mkdir -p "$B"
          for d in /usr/local/sbin /usr/local/bin /usr/sbin /usr/bin /sbin /bin; do
            for f in "$d"/*; do
              n="${f##*/}"
              if [ -f "$f" ] && [ -x "$f" ] && [ ! -e "$CB/$n" ] ; then ln -sfn "$f" "$B/$n"; fi
            done
          done
          for l in "$B"/*; do
            if [ -L "$l" ] && [ ! -e "$l" ]; then echo "still missing: ${l##*/}"; fi
          done
          echo "tools linked: $(ls "$B" | wc -l)"
          S="$GITHUB_WORKSPACE/kernel/kernel/build/build-tools/sysroot"
          rm -rf "$S"
          ln -s / "$S"

      - name: Generate build.config
        working-directory: kernel/kernel-5.10
        run: |
          if sudo apt-get install -y python2; then PY=python2; else 2to3 -w -n scripts/gen_build_config.py; PY=python3; fi
          $PY scripts/gen_build_config.py \
            --kernel-defconfig a07_00_defconfig \
            --kernel-defconfig-overlays "entry_level.config hs07.config" \
            -m user \
            -o ../out/target/product/a07/obj/KERNEL_OBJ/build.config

      - name: Build
        working-directory: kernel/kernel
        env:
          ARCH: arm64
          PLATFORM_VERSION: "12"
          CROSS_COMPILE: aarch64-linux-gnu-
          CROSS_COMPILE_COMPAT: arm-linux-gnueabi-
          OUT_DIR: ../out/target/product/a07/obj/KERNEL_OBJ
          DIST_DIR: ../out/target/product/a07/obj/KERNEL_OBJ
          BUILD_CONFIG: ../out/target/product/a07/obj/KERNEL_OBJ/build.config
          LTO: ${{ inputs.lto }}
          SKIP_MRPROPER: "1"
          LOCALVERSION: "-31702120"
        run: |
          set -o pipefail
          ./build/build.sh 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Collect outputs
        if: success()
        run: |
          df -h /
          cd kernel/out
          find . \( -name 'Image.gz' -o -name 'Image' -o -name '*.ko' -o -name '*.dtb' -o -name 'dtbo.img' -o -name '.config' \) -type f -print \
            | zip -q "$GITHUB_WORKSPACE/a07-kernel-out.zip" -@
          ls -la "$GITHUB_WORKSPACE/a07-kernel-out.zip"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: Upload kernel + modules
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: a07-kernel-out
          path: a07-kernel-out.zip
